import os

config.suffixes.add(".py")

config.substitutions.append(
    ("%pytest", f"{config.python_executable} -m pytest --capture=no -vv")
)


if not config.enable_bindings_python:
    config.unsupported = True



# Only test_*.py modules are tests; every other module is a helper that the
# tests import.
for _, _, files in os.walk(os.path.dirname(__file__)):
    config.excludes.update(
        f for f in files if f.endswith(".py") and not f.startswith("test_")
    )
