import os
import platform

# mlir-runner compiles for the host CPU and resolves runtime routines from the
# host process. Pin the target features and supply the MLIR runtime library
# here so the JIT results do not depend on the CPU or compiler runtime of the
# machine running the test. Tests in this directory must not pass
# mlir_c_runner_utils themselves: mlir-runner aborts on duplicate shared
# libraries. mlir_c_runner_utils also loads mlir_float16_utils, which provides
# the bf16 conversion routines that older host runtimes lack.
runner_utils = next(
    value for key, value in config.substitutions if "mlir_c_runner_utils" in key
)
runner_args = [f"--shared-libs={runner_utils}"]
if platform.machine() in ("x86_64", "AMD64"):
    # AVX-512 FP16 and BF16 support varies across hosts and decides whether
    # 16-bit float arithmetic compiles to instructions or runtime calls.
    runner_args.append("--mattr=-avx512f")


def is_mlir_runner(path):
    return os.path.splitext(os.path.basename(path))[0] == "mlir-runner"


config.substitutions = [
    (key, " ".join([value] + runner_args) if is_mlir_runner(value) else value)
    for key, value in config.substitutions
]
